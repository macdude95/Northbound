name: Daily Portfolio Allocations

# Run before NYSE opens (8:00 AM ET = 12:00 UTC) Monday-Friday
on:
  schedule:
    - cron: '0 12 * * 1-5' # 8:00 AM ET = 12:00 UTC, Mon-Fri
  workflow_dispatch: # Manual trigger button

jobs:
  get-daily-allocations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install mail utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y msmtp mailutils

      - name: Get portfolio allocations
        id: allocations
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          API_CALL_DELAY_SECONDS: '30.0' # 30 second delay between API calls
        run: |
          # Generate strategy allocation string from portfolio config
          strategy_allocation=$(python3 -c "
          import json
          with open('portfolio_configs/current_portfolio.json', 'r') as f:
              config = json.load(f)
          strategies = config['strategies']
          allocation_str = ' '.join([f'{strategy}:{pct}' for strategy, pct in strategies.items()])
          print(allocation_str)
          ")

          # Get strategy breakdown for email (clean output only)
          breakdown_output=$(python scripts/get_allocations.py --breakdown $strategy_allocation 2>&1)
          # Filter out debug lines, keep only the clean breakdown
          breakdown=$(echo "$breakdown_output" | grep -E "^•|^$" | head -20)
          echo "breakdown<<EOF" >> $GITHUB_OUTPUT
          echo "$breakdown" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Get full allocation data for copy/paste (with debug capture)
          set +e  # Temporarily disable exit on error for this section
          full_output=$(python scripts/get_allocations.py $strategy_allocation 2>&1)
          exit_code=$?
          set -e  # Re-enable exit on error

          summary=$(echo "$full_output" | grep "^- " | sed 's/^- //' | tr '\n' '\n')
          debug_info=$(echo "$full_output" | grep -v "^- " | head -50)  # Capture first 50 lines of non-allocation output

          if [ $exit_code -ne 0 ] || [ -z "$summary" ]; then
            summary="❌ ALLOCATION CALCULATION FAILED - FRESH MARKET DATA UNAVAILABLE\\nError: Unable to fetch current market data from Polygon API.\\nThis ensures we don't provide investment advice based on stale data.\\n\\n=== DEBUG INFO ===\\n$debug_info\\n=== END DEBUG ===\\n\\nPlease check the debug info above and API status."
          fi
          echo "summary<<EOF" >> $GITHUB_OUTPUT
          echo "$summary" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send email notification
        if: always()
        run: |
          SUBJECT="Daily Portfolio Allocations - $(date +%Y-%m-%d)"
          BODY="🚀 Daily Portfolio Allocations - $(date +%Y-%m-%d)

          STRATEGY BREAKDOWN:
          ${{ steps.allocations.outputs.breakdown }}

          📱 Calculator: https://macdude95.github.io/Northbound/portfolio-calculator/

          [COPY BELOW FOR CALCULATOR]
          ${{ steps.allocations.outputs.summary }}
          [END COPY SECTION]

          --
          Northbound Trading System"

          # Configure msmtp for Gmail SMTP
          cat > ~/.msmtprc << EOF
          defaults
          tls on
          tls_starttls on
          tls_starttls on
          tls_trust_file /etc/ssl/certs/ca-certificates.crt
          account gmail
          host smtp.gmail.com
          port 587
          auth on
          user ${{ secrets.GMAIL_USERNAME }}
          password ${{ secrets.GMAIL_APP_PASSWORD }}
          from ${{ secrets.GMAIL_USERNAME }}
          account default : gmail
          EOF

          chmod 600 ~/.msmtprc

          # Send email using msmtp
          echo "$BODY" | msmtp -t <<EOF
          To: ${{ secrets.EMAIL_ADDRESS }}
          From: ${{ secrets.GMAIL_USERNAME }}
          Subject: $SUBJECT
          Content-Type: text/plain

          $BODY
          EOF

          echo "Email sent successfully to ${{ secrets.EMAIL_ADDRESS }}"

      - name: Log results
        if: always()
        run: |
          echo "Daily allocation run completed at $(date)"
          echo "Summary: ${{ steps.allocations.outputs.summary }}"
          echo "Full output length: $(echo '${{ steps.allocations.outputs.full_output }}' | wc -c) characters"
